# Fixture, ADR 0011 section 3: 1 provisioning_probes entry (not simulated), with no
# `allow_billable_provisioning` key. `prober/tests/test_config.py` loads this file and expects
# `validate()` to report exactly 1 fault (the allocation guard). Its on-disk companion,
# provisioning_guard_allowed.yaml, is the same entry with only `allow_billable_provisioning: true` added,
# and reports 0 faults. This tests the prober's own per-job consent guard only (ADR 0015):
# Terraform no longer reads the targets file for consent, only this guard does.
experiment: ftg-20261014-example
azure:
  jobs:
    - {module: az_spot_score, regions: [eastus]}
  modules:
    az_spot_score:
      type: az_spot_score
      spot_sizes: [Standard_NC40ads_H100_v5]
  provisioning_probes:
    az_capacity_reservation:
      - {sku: Standard_D2as_v4, region: eastus, zone: null, n: 2, placement_group_mode: multi}
