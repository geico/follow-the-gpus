# A targets file with no azure.provisioning_probes key at all. `validate()` must report 0 faults:
# with no allocation job, there is nothing for the prober's consent guard to check.
experiment: ftg-20261014-example
azure:
  jobs:
    - {module: az_spot_score, regions: [eastus]}
  modules:
    az_spot_score:
      type: az_spot_score
      spot_sizes: [Standard_NC40ads_H100_v5]
