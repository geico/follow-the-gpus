# Companion of provisioning_guard.yaml: the same fixture, with only `allow_billable_provisioning: true`
# added to the 1 provisioning_probes entry. `validate()` must report 0 faults on this file.
# `test_shared_allocation_guard_fixtures_differ_only_by_allow_billable_provisioning` in
# prober/tests/test_config.py keeps the 2 files from drifting out of step. This tests the
# prober's own per-job consent guard only (ADR 0015); Terraform does not read this file.
experiment: ftg-20261014-example
azure:
  jobs:
    - {module: az_spot_score, regions: [eastus]}
  modules:
    az_spot_score:
      type: az_spot_score
      spot_sizes: [Standard_NC40ads_H100_v5]
  provisioning_probes:
    az_capacity_reservation:
      - {sku: Standard_D2as_v4, region: eastus, zone: null, n: 2, placement_group_mode: multi, allow_billable_provisioning: true}
