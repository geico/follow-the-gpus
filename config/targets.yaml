# The worked example experiment file for both clouds. The schema is spec/0003-prober-core-spec.md
# section 3 and ADR 0010. A single-cloud user deletes the other section. Scope: continental US,
# GPU only. A listed job is enabled; nothing else enables it (ADR 0010 section 1).
experiment: ftg-20261014-example

aws:
  modules:
    aws_spot_score:
      type: aws_spot_score
      # Spot score requests, spec 0002 section 4.2. 9 entries; the code cap is 11.
      # Put a new entry at the end, after the entries that already have a score, so a freeze
      # (spec 0008 section 4.4) on a new entry does not skip an older one.
      spot_score_requests:
        - {name: p5-1x, instance_types: [p5.4xlarge], label: "Spot score, 1x H100, this size"}
        - {name: g7e, instance_types: [g7e.2xlarge], label: "Spot score, 1x RTX PRO 6000, this size"}
        - {name: g6e, instance_types: [g6e.xlarge], label: "Spot score, 1x L40S, this size"}
        - {name: g5, instance_types: [g5.xlarge], label: "Spot score, 1x A10G, this size"}
        - {name: g4dn, instance_types: [g4dn.xlarge], label: "Spot score, 1x T4, this size"}
        - {name: g6, instance_types: [g6.xlarge], label: "Spot score, 1x L4, this size"}
        - {name: control-cpu, instance_types: [m5.4xlarge], label: "Control: CPU alone"}
        - {name: control-cpu-trio, instance_types: [m5.2xlarge, m5.4xlarge, m5.8xlarge], label: "Control: CPU 3 sizes"}
        - {name: g5-family, instance_types: [g5.xlarge, g5.2xlarge, g5.4xlarge], label: "Spot score, 1x A10G, any of 3 sizes"}
    aws_cb_offering:
      type: aws_cb_offering
      # Capacity Block offerings, spec 0002 section 4.1.
      instance_types: [p5.4xlarge, p5.48xlarge, p5en.48xlarge, p6-b200.48xlarge, p4d.24xlarge]
      instance_count: 1
      # 1x H100 (p5.4xlarge) is also asked for 4 and 8 instances (spec 0008 section 3.3); every
      # other type uses instance_count. Each (type, count) pair is a separate series.
      instance_counts:
        p5.4xlarge: [1, 4, 8]
      duration_hours: [24, 72, 120, 168]
      start_window_days: 14
      # aws_cb_earliest durations, spec 0008 section 3A. The 3 Capacity Block probes queue their
      # calls; the worker makes 1 call per Region each 30 s (spec 0008 section 3.3); the
      # worst-case limit is 200 calls per Region (section 3.3 rule 1; aws_cb_longest, section
      # 3B.5). This file: 7 pairs x (4 + 2 + 19) = 175.
      earliest_duration_hours: [24, 168]
  jobs:
    - {module: aws_spot_score, regions: [us-east-1, us-east-2, us-west-2], interval: 5m}
    - {module: aws_spot_price, regions: [us-east-1, us-east-2, us-west-2], interval: 5m}
    - {module: aws_spot_advisor, regions: [us-east-1, us-east-2, us-west-2], interval: 24h}
    - {module: aws_cb_offering, regions: [us-east-1, us-east-2, us-west-2], interval: 2h}
    - {module: aws_cb_earliest, regions: [us-east-1, us-east-2, us-west-2], interval: 2h}
    - {module: aws_cb_longest, regions: [us-east-1, us-east-2, us-west-2], interval: 2h}
  # The cadence of the AWS provisioning probe (aws_odcr). Provisioning probes are not jobs: ADR 0010
  # section 10, item 4 keeps them and their Terraform wiring out of scope here.
  cadence: {aws_odcr: 2h}
  # AWS provisioning probe (aws_odcr), spec 0002 section 4.9. The default is safe: every entry
  # is `simulate: true`, so a fresh deploy creates no Capacity Reservation. An entry with no
  # `simulate: true` creates real capacity and needs its own `allow_billable_provisioning: true`
  # (ADR 0011 section 3, spec 0003 section 3).
  #
  # `n_max: 16` turns on the upward search of ADR 0023 for the entry: after a full success, the
  # probe asks for double, up to `n_max` or the quota ceiling. The key is optional, and an integer
  # above `n`, at most 16.
  #
  # The provisioning matrix, ADR 0018 and spec 0002 section 4.10: every GPU type of the Spot score
  # requests (the smallest size of each GPU class, 1 GPU each) in every Region of the jobs above.
  # This is the reference matrix; your own targets file is what runs. Every cell starts with
  # `simulate: true`. To run a cell for real, you drop its `simulate: true` and set
  # its own `allow_billable_provisioning: true`. An entry names the type and the
  # Region, not a zone: each cycle probes every zone of the Region that offers the type, by zone ID. Every cell stays `simulate: true` until you enable it.
  provisioning_probes:
    # Control: a cheap non-GPU type that proves the path (spec 0002 section 1).
    - {instance_type: m5.large, region: us-east-1, n: 2, n_max: 16, simulate: true}
    # us-east-1
    - {instance_type: p5.4xlarge, region: us-east-1, n: 2, n_max: 16, simulate: true}
    - {instance_type: g7e.2xlarge, region: us-east-1, n: 2, n_max: 16, simulate: true}
    - {instance_type: g6e.xlarge, region: us-east-1, n: 2, n_max: 16, simulate: true}
    - {instance_type: g5.xlarge, region: us-east-1, n: 2, n_max: 16, simulate: true}
    - {instance_type: g4dn.xlarge, region: us-east-1, n: 2, n_max: 16, simulate: true}
    - {instance_type: g6.xlarge, region: us-east-1, n: 2, n_max: 16, simulate: true}
    # us-east-2
    - {instance_type: p5.4xlarge, region: us-east-2, n: 2, n_max: 16, simulate: true}
    - {instance_type: g7e.2xlarge, region: us-east-2, n: 2, n_max: 16, simulate: true}
    - {instance_type: g6e.xlarge, region: us-east-2, n: 2, n_max: 16, simulate: true}
    - {instance_type: g5.xlarge, region: us-east-2, n: 2, n_max: 16, simulate: true}
    - {instance_type: g4dn.xlarge, region: us-east-2, n: 2, n_max: 16, simulate: true}
    - {instance_type: g6.xlarge, region: us-east-2, n: 2, n_max: 16, simulate: true}
    # us-west-2
    - {instance_type: p5.4xlarge, region: us-west-2, n: 2, n_max: 16, simulate: true}
    - {instance_type: g7e.2xlarge, region: us-west-2, n: 2, n_max: 16, simulate: true}
    - {instance_type: g6e.xlarge, region: us-west-2, n: 2, n_max: 16, simulate: true}
    - {instance_type: g5.xlarge, region: us-west-2, n: 2, n_max: 16, simulate: true}
    - {instance_type: g4dn.xlarge, region: us-west-2, n: 2, n_max: 16, simulate: true}
    - {instance_type: g6.xlarge, region: us-west-2, n: 2, n_max: 16, simulate: true}
  # GPU quota requests, spec 0012. `make quota/aws` prints them; QUOTA_ARGS=--apply sends them.
  # The shape is the shape of azure.quota. Each size asks for count x vCPUs, in the Spot and the
  # On-Demand quota of its group. The counts follow the Azure counts of the same GPU class.
  # L40S and L4 have no Azure size in azure.quota, so they use 16.
  quota:
    regions: [us-east-1, us-east-2, us-west-2]
    sizes:
      - {size: p5.4xlarge, count: 8}      # H100
      - {size: g7e.2xlarge, count: 8}     # RTX PRO 6000
      - {size: g6e.xlarge, count: 16}     # L40S
      - {size: g5.xlarge, count: 16}      # A10G
      - {size: g4dn.xlarge, count: 32}    # T4
      - {size: g6.xlarge, count: 16}      # L4

azure:
  modules:
    az_spot_score:
      type: az_spot_score
      # GPU sizes from research/gpu-lineup-aws-azure.md.
      spot_sizes:
        - Standard_NC40ads_H100_v5
        - Standard_NC24ads_A100_v4
        - Standard_NV36ads_A10_v5
        - Standard_NC4as_T4_v3
        - Standard_NC144ds_xl_RTXPRO6000BSE_v6
    az_spot:
      type: az_spot
      spot_sizes:
        - Standard_NC40ads_H100_v5
        - Standard_NC24ads_A100_v4
        - Standard_NV36ads_A10_v5
        - Standard_NC4as_T4_v3
        - Standard_NC144ds_xl_RTXPRO6000BSE_v6
      # A Spot price with an effective date older than this many days is no signal. The row
      # keeps the raw price and gets outcome `none`. Spec 0009 sections 3.3 and 3.5.
      spot_price_max_age_days: 540
  jobs:
    - {module: az_spot_score, regions: [eastus, eastus2, southcentralus, westus2, westus3, centralus, northcentralus, westus, westcentralus], interval: 15m}
    - {module: az_spot, regions: [eastus, eastus2, southcentralus, westus2, westus3, centralus, northcentralus, westus, westcentralus], interval: 5m}
  # The cadence of the pre-check and both Azure provisioning probes. Provisioning probes are not
  # jobs: see the `aws.cadence` note above.
  cadence: {az_provisioning: 2h}
  # Provisioning probes, spec 0002 sections 4.3 to 4.5. The entries are grouped by probe type
  # (ADR 0022): `az_capacity_reservation` makes a capacity reservation of `n_requested` instances, and `az_vmss_flex`
  # scales the scale set of the entry from 0 to `n_requested`. Terraform builds a reservation group per Region
  # of the first type and a scale set per entry of the second; the prober finds each by its tags,
  # never by a name. At most 1 `az_vmss_flex` entry per size and Region. The default is safe:
  # every entry has `simulate: true`, so a fresh deploy creates no provisioning probe capacity.
  # An entry with no `simulate: true` creates real capacity and needs its own
  # `allow_billable_provisioning: true` (ADR 0011 section 3, spec 0003 section 3). There is no
  # `run_mode` key (ADR 0011: no `run_mode` anywhere); the Azure Terraform stack's "active" rule
  # (`terraform/azure/probe.tf`) reads `simulate` from this same file.
  # `n_max: 16` on an `az_capacity_reservation` entry turns on the upward search of ADR 0023. The
  # `az_vmss_flex` entries have none: 16 VMs cannot boot inside the probe timeout.
  # For an `az_capacity_reservation` control entry, pick a size that your subscription can
  # allocate and that supports capacity reservations:
  # `az vm list-skus -l <region> --size <size>`, with the full size name, must list the size
  # with an empty `restrictions` list, and its capability `CapacityReservationSupported`
  # must be `True`. A size that the subscription cannot use can be missing from the output.
  #
  # The provisioning matrix, ADR 0018 and spec 0002 section 4.10: every size of `spot_sizes` (the
  # smallest 1-GPU size of each GPU class) in every region of the jobs above. This is the
  # reference matrix; your own targets file is what runs. Every cell starts with `simulate: true`;
  # a cell runs for real only when you drop its `simulate: true` and set its own `allow_billable_provisioning: true`
  # (and set grant_billable_provisioning in terraform.tfvars). The H100 and RTX PRO 6000 sizes do not support capacity
  # reservations, so they are `az_vmss_flex` entries (spec 0002, D6) and, when not simulated,
  # get a scale set that needs a probe subnet in its region. The A100, A10, and T4 sizes and the
  # controls are `az_capacity_reservation` entries (a reservation has no placement group mode,
  # spec 0010 section 5). A cell is listed only where the Region offers the size: 31 of the 45
  # cells (the preflight check rejects the others). Every cell stays `simulate: true` until you enable it.
  provisioning_probes:
    az_capacity_reservation:
      - {sku: Standard_D2as_v4, region: eastus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_D2as_v4, region: eastus2, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC24ads_A100_v4, region: eastus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NV36ads_A10_v5, region: eastus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC4as_T4_v3, region: eastus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC24ads_A100_v4, region: eastus2, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NV36ads_A10_v5, region: eastus2, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC4as_T4_v3, region: eastus2, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC24ads_A100_v4, region: southcentralus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NV36ads_A10_v5, region: southcentralus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC4as_T4_v3, region: southcentralus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC24ads_A100_v4, region: westus2, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NV36ads_A10_v5, region: westus2, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC4as_T4_v3, region: westus2, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC24ads_A100_v4, region: westus3, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NV36ads_A10_v5, region: westus3, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC4as_T4_v3, region: westus3, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC24ads_A100_v4, region: centralus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NV36ads_A10_v5, region: centralus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC4as_T4_v3, region: centralus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NV36ads_A10_v5, region: northcentralus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC4as_T4_v3, region: northcentralus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC24ads_A100_v4, region: westus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NV36ads_A10_v5, region: westus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC4as_T4_v3, region: westus, zone: null, n: 2, n_max: 16, placement_group_mode: multi, simulate: true}
    az_vmss_flex:
      - {sku: Standard_NC40ads_H100_v5, region: eastus, zone: null, n: 2, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC40ads_H100_v5, region: eastus2, zone: null, n: 2, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC40ads_H100_v5, region: southcentralus, zone: null, n: 2, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC40ads_H100_v5, region: westus2, zone: null, n: 2, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC144ds_xl_RTXPRO6000BSE_v6, region: westus2, zone: null, n: 2, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC40ads_H100_v5, region: westus3, zone: null, n: 2, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC40ads_H100_v5, region: centralus, zone: null, n: 2, placement_group_mode: multi, simulate: true}
      - {sku: Standard_NC40ads_H100_v5, region: westus, zone: null, n: 2, placement_group_mode: multi, simulate: true}
  # Provisioning probe timing in seconds, spec 0003 section 3 (decision Z17 of spec 0010). These
  # are the defaults. probe_timeout_seconds + teardown_timeout_seconds must be 30 s or more under
  # the sweeper threshold FTG_MAX_AGE_SECONDS (180 s, terraform/azure/sweeper.tf). Raise both
  # together.
  probe_timeout_seconds: 90
  poll_interval_seconds: 5
  teardown_timeout_seconds: 60
  # GPU quota requests, spec 0011. `make quota/azure` prints them; QUOTA_ARGS=--apply sends them.
  # The command reads the quota family and the vCPUs of each size from the SKU list of the region.
  # Each family asks for count x vCPUs. A size without `regions` uses every quota region.
  quota:
    regions: [eastus, eastus2, centralus, southcentralus, westus, westus2, westus3]
    sizes:
      - {size: Standard_NC40ads_H100_v5, count: 8}
      - {size: Standard_NC24ads_A100_v4, count: 8}
      - {size: Standard_NV36ads_A10_v5, count: 16}
      - {size: Standard_NC4as_T4_v3, count: 32}
      - {size: Standard_NC144ds_xl_RTXPRO6000BSE_v6, count: 8, regions: [westus2]}
